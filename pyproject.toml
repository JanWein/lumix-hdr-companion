[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumix-hdr-companion"
version = "0.1.0"
description = "Local bracket processing companion for Lumix photographs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2.3", "Pillow>=10,<13", "opencv-python-headless==4.12.0.88"]

[project.scripts]
lumix-hdr = "lumix_hdr.cli:main"

[tool.setuptools.packages.find]
include = ["lumix_hdr*"]

