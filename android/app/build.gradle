plugins { id 'com.android.application' }
android {
    namespace 'de.weinert.lumixhdr'
    compileSdk 35
    defaultConfig {
        applicationId 'de.weinert.lumixhdr'
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName '0.3.6'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    packaging { jniLibs { useLegacyPackaging true } }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all { jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED' }
        }
    }
}
dependencies {
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
